[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qaznews-kappa"
dynamic = ["version"]
description = "Inter-annotator agreement check (Cohen's, Light's and Fleiss' kappa) for labelled news corpora"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yerlen Armanuly" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
qaznews-kappa = "qaznews_kappa.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qaznews_kappa.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
